[platformio]
src_dir = pio

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = .
lib_ldf_mode = deep+

[env:uno_basic]
platform = atmelavr@5.3.0
board = uno
build_flags =
  -Wall
  -Wextra
  -Werror
  -Wno-unused-parameter
build_src_filter =
  +<uno_basic/main.cpp>
  -<uno_cooperative_polling/main.cpp>
  -<core2_quick_start/main.cpp>
  -<core2_cloud_logger/main.cpp>

[env:uno_cooperative_polling]
platform = atmelavr@5.3.0
board = uno
build_flags =
  -Wall
  -Wextra
  -Werror
  -Wno-unused-parameter
build_src_filter =
  -<uno_basic/main.cpp>
  +<uno_cooperative_polling/main.cpp>
  -<core2_quick_start/main.cpp>
  -<core2_cloud_logger/main.cpp>

[env:core2_quick_start]
platform = espressif32@6.12.0
board = m5stack-core2
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -Wall
  -Wextra
lib_deps =
  m5stack/M5Unified@^0.2.17
  bblanchon/ArduinoJson@^7.4.2
build_src_filter =
  -<uno_basic/main.cpp>
  -<uno_cooperative_polling/main.cpp>
  +<core2_quick_start/main.cpp>
  -<core2_cloud_logger/main.cpp>

[env:core2_cloud_logger]
platform = espressif32@6.12.0
board = m5stack-core2
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -Wall
  -Wextra
lib_deps =
  m5stack/M5Unified@^0.2.17
  bblanchon/ArduinoJson@^7.4.2
build_src_filter =
  -<uno_basic/main.cpp>
  -<uno_cooperative_polling/main.cpp>
  -<core2_quick_start/main.cpp>
  +<core2_cloud_logger/main.cpp>
